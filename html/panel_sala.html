<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sala de juego - FreeSIMON</title>

    <link rel="stylesheet" href="../css/panel_sala.css?v=detalles">
    <link rel="stylesheet" href="../data/personaje.css">
    <link rel="stylesheet" href="../css/tema_bloques.css">

</head>

<body class="pantalla-sala">

    <main class="sala">

        <!-- =========================================
             FRANJA SUPERIOR
        ========================================== -->

        <header class="franja-superior">

            <div class="datos-jugador">

                <h1>Sala de juego</h1>

                <div id="datosJugador" class="informacion-jugador">
                    <!-- Datos cargados desde sessionStorage -->
                </div>

            </div>

        </header>


        <!-- =========================================
             ZONA CENTRAL
             DOS COLUMNAS
        ========================================== -->

        <section class="zona-central">


            <!-- =====================================
                 PANEL SUPERIOR IZQUIERDO
            ====================================== -->

            <section class="panel panel-personajes" aria-label="Selección de personajes">
                <div id="selectorPersonajes" class="contenido-panel personajes">
                </div>

            </section>


            <!-- =====================================
                 PANEL SUPERIOR DERECHO
            ====================================== -->

            <section class="panel panel-salas" aria-label="Salas creadas">
                <div id="listaSalas" class="contenido-panel lista-salas">

                    <!--
                        Los grupos creados desde
                        panel_grupo aparecerán aquí.
                    -->

                </div>

            </section>


        </section>


        <!-- =========================================
             ZONA INFERIOR
        ========================================== -->

        <section class="zona-inferior">

            <section class="panel panel-detalle-sala" aria-label="Detalle de la sala">
                <div id="detalleSala" class="contenido-panel detalle-contenido" aria-live="polite">
                    <p class="sin-seleccion">Selecciona una sala para ver sus detalles.</p>
                </div>
            </section>

            <section class="panel panel-acciones" aria-label="Acciones de la sala">
                <div class="contenido-panel acciones">
                    <button id="btnIniciarJuego" class="boton boton-iniciar" type="button">
                        Cargar juego
                    </button>

                    <button id="btnVolver" class="boton boton-volver" type="button">
                        Volver
                    </button>
                    <p id="mensajeCargarJuego" class="mensaje-carga" role="status" aria-live="polite"></p>
                </div>
            </section>

        </section>

    </main>


    <script src="../js/panel_sala.js?v=temporizador-evaluacion"></script>
    <script src="../data/personaje.js"></script>

</body>

</html>
