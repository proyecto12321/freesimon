<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar preguntas - FreeSIMON</title>
    <link rel="stylesheet" href="../css/panel_pregunta.css">
</head>

<body>
    <main class="contenedor">
        <section class="panel">
            <h1>Agregar preguntas</h1>
            <p class="descripcion">
                Escribe cada pregunta, agrega sus cuatro alternativas y marca la respuesta correcta.
            </p>

            <p id="limitePreguntas" class="limite-preguntas" role="status" aria-live="polite"></p>

            <form id="formPregunta" class="formulario">
                <div class="campo">
                    <label for="textoPregunta">Pregunta</label>
                    <textarea id="textoPregunta" rows="3" maxlength="500"
                        placeholder="Escribe la pregunta" required></textarea>
                </div>

                <fieldset class="alternativas">
                    <legend>Alternativas (marca la correcta)</legend>

                    <div class="alternativa">
                        <label for="alternativa1">Alternativa 1</label>
                        <input id="alternativa1" name="alternativa1" type="text" maxlength="250"
                            placeholder="Escribe una alternativa" required>
                        <label class="selector-correcta" for="correcta1">
                            <input id="correcta1" type="radio" name="respuestaCorrecta" value="0" required>
                            Correcta
                        </label>
                    </div>

                    <div class="alternativa">
                        <label for="alternativa2">Alternativa 2</label>
                        <input id="alternativa2" name="alternativa2" type="text" maxlength="250"
                            placeholder="Escribe una alternativa" required>
                        <label class="selector-correcta" for="correcta2">
                            <input id="correcta2" type="radio" name="respuestaCorrecta" value="1" required>
                            Correcta
                        </label>
                    </div>

                    <div class="alternativa">
                        <label for="alternativa3">Alternativa 3</label>
                        <input id="alternativa3" name="alternativa3" type="text" maxlength="250"
                            placeholder="Escribe una alternativa" required>
                        <label class="selector-correcta" for="correcta3">
                            <input id="correcta3" type="radio" name="respuestaCorrecta" value="2" required>
                            Correcta
                        </label>
                    </div>

                    <div class="alternativa">
                        <label for="alternativa4">Alternativa 4</label>
                        <input id="alternativa4" name="alternativa4" type="text" maxlength="250"
                            placeholder="Escribe una alternativa" required>
                        <label class="selector-correcta" for="correcta4">
                            <input id="correcta4" type="radio" name="respuestaCorrecta" value="3" required>
                            Correcta
                        </label>
                    </div>
                </fieldset>

                <p id="mensaje" class="mensaje" aria-live="polite"></p>

                <button class="btn btn-guardar" type="submit">Agregar pregunta</button>
            </form>

            <section class="seccion-preguntas" aria-labelledby="tituloPreguntas">
                <h2 id="tituloPreguntas">Preguntas agregadas</h2>
                <p id="sinPreguntas" class="sin-preguntas">Todavía no has agregado preguntas.</p>
                <ol id="listaPreguntas" class="lista-preguntas"></ol>
            </section>

            <button id="btnVolver" class="btn btn-volver" type="button">Volver a configuración</button>
        </section>
    </main>

    <script src="../js/panel_pregunta.js"></script>
</body>

</html>
