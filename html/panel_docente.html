<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel docente - FreeSIMON</title>

    <link rel="stylesheet" href="../css/panel_docente.css?v=2">
    <link rel="stylesheet" href="../css/tema_bloques.css">
</head>

<body class="pantalla-docente">

    <main class="contenedor">

        <section class="tarjeta">

            <h1>Panel docente</h1>

            <p class="descripcion">
                Ingresa el código de acceso para continuar.
            </p>

            <div class="formulario">

                <label for="codigo">Código de acceso</label>

                <input type="password" id="codigo" placeholder="Ingresa el código" inputmode="numeric"
                    autocomplete="off">

                <p id="mensaje" class="mensaje"></p>

                <button id="btnIngresar" class="btn btn-ingresar">
                    Ingresar
                </button>

                <button id="btnVolver" class="btn btn-volver">
                    Volver
                </button>

            </div>

        </section>

    </main>

    <script src="../js/panel_docente.js"></script>

</body>

</html>
