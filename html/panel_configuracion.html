<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel de administración docente - FreeSIMON</title>

    <link rel="stylesheet" href="../css/panel_configuracion.css?v=diseno">
    <link rel="stylesheet" href="../css/tema_bloques.css">

</head>

<body class="pantalla-configuracion">
    <div class="configuracion-layout">
        <main class="contenedor">

            <section class="panel">

                <h1>
                    Panel de administración docente
                </h1>


                <p class="descripcion">
                    Configura la actividad antes de iniciar el juego.
                </p>


                <!-- =================================
                 BOTONES PRINCIPALES
            ================================== -->

                <div class="opciones">


                    <!-- CANTIDAD DE PREGUNTAS -->

                    <button id="btnPreguntas" class="opcion">

                        <span class="titulo-opcion">
                            Cantidad de preguntas
                        </span>

                        <span id="cantidadSeleccionada" class="detalle-opcion">
                            No configurada
                        </span>

                    </button>

                    <button id="btnAgregarPreguntas" class="opcion">

                        <span class="titulo-opcion">
                            Agregar preguntas
                        </span>

                        <span id="preguntasRegistradas" class="detalle-opcion">
                            No hay preguntas agregadas
                        </span>

                    </button>


                    <!-- CREAR GRUPOS -->

                    <button id="btnCrearGrupos" class="opcion">

                        <span class="titulo-opcion">
                            Crear grupos
                        </span>

                        <span class="detalle-opcion">
                            Configurar grupos de estudiantes
                        </span>

                    </button>


                    <!-- CARGAR JUEGO -->

                    <button id="btnCargarJuego" class="opcion">

                        <span class="titulo-opcion">
                            Cargar juego
                        </span>

                        <span class="detalle-opcion">
                            Guardar la configuración y abrir las salas
                        </span>

                    </button>

                    <p id="mensajeCargarJuego" class="mensaje-cargar-juego" role="status"
                        aria-live="polite"></p>


                </div>


                <!-- =================================
                 BOTÓN VOLVER
            ================================== -->

                <button id="btnVolver" class="btn-volver">
                    Volver
                </button>

            </section>


            <!-- =================================
             VENTANA TEMPORAL
             CANTIDAD DE PREGUNTAS
        ================================== -->

            <div id="modalPreguntas" class="modal oculto">

                <div class="modal-contenido">

                    <h2>
                        Cantidad de preguntas
                    </h2>

                    <p>
                        Selecciona cuántas preguntas tendrá
                        el juego.
                    </p>


                    <label for="cantidadPreguntas">
                        Número de preguntas
                    </label>

                    <input type="number" id="cantidadPreguntas" min="1" max="30" placeholder="Máximo 30">


                    <p id="mensajePreguntas" class="mensaje"></p>


                    <div class="botones-modal">

                        <button id="btnGuardarPreguntas" class="btn-guardar">
                            Guardar
                        </button>

                        <button id="btnCancelarPreguntas" class="btn-cancelar">
                            Cancelar
                        </button>

                    </div>

                </div>

            </div>

        </main>

        <aside class="panel-escenarios" aria-labelledby="tituloEscenarios">
            <div class="encabezado-escenarios">
                <h2 id="tituloEscenarios">Elige tu escenario</h2>
                <p>Selecciona el mundo donde se jugará la aventura.</p>
            </div>
            <div id="listaEscenarios" class="lista-escenarios" aria-label="Escenarios disponibles"></div>
            <p id="estadoEscenario" class="estado-escenario" role="status" aria-live="polite">
                Aún no has seleccionado un escenario.
            </p>
        </aside>
    </div>

    <script src="../js/panel_configuracion.js?v=escenarios"></script>

</body>

</html>
